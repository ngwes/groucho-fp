stages:
  - test
  - release
  - publish

unit-tests:
  stage: test
  image: node:22
  script:
    - npm ci
    - npm test -- --run
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

sast:
  stage: test
include:
  - template: Security/SAST.gitlab-ci.yml

semantic-release:
  stage: release
  image: node:22
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm ci
    - npx semantic-release

npm-publish:
  stage: publish
  image: node:22.14
  needs: []
  when: manual
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - npm install -g npm@latest
    - npm --version
    - npm ci
    - npm run build
    - npm publish --access public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
